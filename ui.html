<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TubeGrab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff5a4e'/%3E%3Cpath d='M16 7v12m0 0-5-5m5 5 5-5M9 24h14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f4f1; --panel:#ffffff; --panel-2:#f0eee9; --line:#e3e0d9; --text:#1d1c1a; --muted:#6f6b63;
  --accent:#ff5a4e; --accent-ink:#fff; --accent-soft:#ffe7e4; --ok:#1f9d5c; --ok-soft:#dcf4e7;
  --warn:#b7791f; --warn-soft:#fdf1dc; --err:#d6372b; --err-soft:#fde4e1; --track:#e8e5df;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05); --radius:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121212; --panel:#1b1b1b; --panel-2:#232323; --line:#2e2e2e; --text:#f1efea; --muted:#9a968e;
  --accent:#ff6a5e; --accent-soft:#3a1f1c; --ok:#46c785; --ok-soft:#17301f; --warn:#e6a94a; --warn-soft:#33281a;
  --err:#ff6b60; --err-soft:#3a1d1b; --track:#2c2c2c; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo svg{width:32px;height:32px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line)}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--err-soft);color:var(--err);border-color:transparent}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--panel-2)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel-2);color:var(--text)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.icon{width:16px;height:16px;flex:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.banner{display:flex;gap:12px;padding:12px 14px;border-radius:12px;margin-bottom:12px;background:var(--warn-soft);color:var(--text);border:1px solid transparent}
.banner b{color:var(--warn)}
.banner.err b{color:var(--err)}
.banner.err{background:var(--err-soft)}
.banner.ok{background:var(--ok-soft)} .banner.ok b{color:var(--ok)} .banner a{color:inherit;font-weight:600}
.banner code{background:rgba(127,127,127,.15);padding:1px 6px;border-radius:6px;font-size:12.5px;user-select:all}
.add{padding:16px;margin-bottom:22px}
.add textarea{width:100%;min-height:92px;resize:vertical;border:1px dashed var(--line);border-radius:10px;background:var(--panel-2);padding:12px;outline:none;transition:border-color .15s}
.add textarea:focus,.add.drag textarea{border-color:var(--accent);border-style:solid}
.add-row{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;padding:5px 12px;border-radius:7px;cursor:pointer;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 10px;outline:none}
select:focus,input:focus{border-color:var(--accent)}
.section-head{display:flex;align-items:center;gap:10px;margin:0 0 10px}
.section-head h2{font-size:15px;margin:0;font-weight:650}
.count{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.card{display:flex;gap:14px;padding:12px;align-items:flex-start}
.thumb{width:132px;aspect-ratio:16/9;border-radius:9px;background:var(--panel-2) center/cover no-repeat;flex:none;position:relative;overflow:hidden}
.thumb .badge{position:absolute;right:5px;bottom:5px;background:rgba(0,0,0,.75);color:#fff;font-size:11px;padding:1px 6px;border-radius:5px}
.body{flex:1;min-width:0}
.title{font-weight:600;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.controls input[type=number]{width:74px}
.actions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.items{margin-top:10px;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel-2)}
.items label{display:flex;gap:10px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:13px}
.items label:last-child{border-bottom:0}
.items .n{color:var(--muted);width:30px;text-align:right;font-variant-numeric:tabular-nums}
.items .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items .d{color:var(--muted);font-variant-numeric:tabular-nums}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.bar{height:6px;background:var(--track);border-radius:99px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease}
.job.done .bar>i{background:var(--ok)}
.job.error .bar>i,.job.partial .bar>i{background:var(--err)}
.job.queued .bar>i{width:0!important}
.job.processing .bar>i{background:repeating-linear-gradient(45deg,var(--accent) 0 10px,color-mix(in srgb,var(--accent) 70%,#fff) 10px 20px);background-size:28px 28px;animation:slide 1s linear infinite}
@keyframes slide{to{background-position:28px 0}}
.status{display:flex;gap:10px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.status .st{font-weight:600}
.job.done .st{color:var(--ok)} .job.error .st,.job.partial .st{color:var(--err)} .job.downloading .st,.job.processing .st{color:var(--accent)}
.errs{margin-top:8px;font-size:12.5px;background:var(--err-soft);border-radius:9px;padding:8px 10px;max-height:120px;overflow:auto;word-break:break-word}
.errs .hint{font-weight:600;margin-bottom:4px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;border:1px dashed var(--line);border-radius:var(--radius)}
.spin{width:16px;height:16px;border:2px solid var(--track);border-top-color:var(--accent);border-radius:50%;animation:rot .8s linear infinite;display:inline-block;vertical-align:-3px}
@keyframes rot{to{transform:rotate(360deg)}}
.tag{font-size:11px;font-weight:600;padding:1px 7px;border-radius:6px;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);margin-right:4px}
.tag.audio{background:var(--accent-soft);color:var(--accent);border-color:transparent}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--panel);color:var(--text);padding:0;width:min(560px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-head{display:flex;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-head h3{margin:0;font-size:16px;flex:1}
.dlg-body{padding:6px 18px 16px;max-height:70vh;overflow:auto}
.dlg-body h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.field{display:flex;align-items:center;gap:10px;padding:7px 0}
.field>span{flex:1}
.field small{display:block;color:var(--muted);font-size:12px}
.field input[type=text]{width:180px}
.folder{display:flex;gap:8px}
.folder input{flex:1;min-width:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100vw - 32px);z-index:9}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.card.waiting{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.note{margin-top:8px;font-size:13px;color:var(--accent)}
.hidden{display:none!important}
@media (max-width:640px){
  .card{flex-wrap:wrap}.thumb{width:100%}.actions{flex-direction:row;width:100%;justify-content:flex-end}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" fill="var(--accent)"/><path d="M16 7v12m0 0-5-5m5 5 5-5M9 24h14" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      TubeGrab
    </div>
    <div class="pills" id="pills"></div>
    <div class="spacer"></div>
    <button class="btn" id="openFolder" title="Open download folder">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Folder</button>
    <button class="btn" id="openSettings">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
  </header>

  <div id="banners"></div>

  <div class="panel add" id="addPanel">
    <textarea id="links" placeholder="Paste YouTube links here - videos, playlists, channels, Shorts. One per line, or drop a links.txt file.&#10;Then press Download (or Ctrl+Enter)."></textarea>
    <div class="add-row">
      <button class="btn primary" id="downloadBtn" title="Download now (Ctrl+Enter)">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-5-5m5 5 5-5M5 20h14"/></svg>Download</button>
      <button class="btn" id="addBtn" title="Preview first - pick playlist items, per-link Video/Audio">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add to list</button>
      <button class="btn" id="pasteBtn">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/></svg>Paste</button>
      <label class="btn" title="Import your old links.txt">Import .txt<input type="file" id="importFile" accept=".txt,.csv,.json" hidden></label>
      <div class="spacer"></div>
      <div class="seg" id="modeSeg">
        <button data-mode="video">🎬 Video</button>
        <button data-mode="audio">🎵 Audio</button>
      </div>
      <select id="quickQuality" title="Quality"></select>
    </div>
  </div>

  <div id="readySection" class="hidden">
    <div class="section-head">
      <h2>Ready to download</h2><span class="count" id="readyCount"></span>
      <div class="spacer"></div>
      <button class="btn ghost sm" id="clearReady">Clear</button>
      <button class="btn primary sm" id="downloadAll">Download all</button>
    </div>
    <div class="list" id="ready"></div>
  </div>

  <div class="section-head">
    <h2>Downloads</h2><span class="count" id="jobCount"></span>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="clearDone">Clear finished</button>
  </div>
  <div class="list" id="jobs"></div>
  <div class="empty" id="jobsEmpty">Nothing downloading yet. Paste a link above to get started.</div>
</div>

<dialog id="settings">
  <div class="dlg-head"><h3>Settings</h3><button class="btn ghost sm" id="closeSettings">Done</button></div>
  <div class="dlg-body">
    <h4>Save to</h4>
    <div class="folder"><input type="text" data-key="download_dir"><button class="btn" id="browse">Browse…</button></div>

    <h4>Video</h4>
    <label class="field"><span>Max quality</span>
      <select data-key="video_quality"><option value="best">Best available</option><option value="2160">4K (2160p)</option><option value="1440">1440p</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></label>
    <label class="field"><span>File type<small>MP4 plays on every device; MKV keeps the original streams</small></span>
      <select data-key="video_container"><option value="mp4">MP4</option><option value="mkv">MKV</option></select></label>
    <label class="field"><span>Embed subtitles</span><input type="checkbox" data-key="subtitles"></label>
    <label class="field"><span>Include auto-generated subtitles</span><input type="checkbox" data-key="auto_subtitles"></label>
    <label class="field"><span>Subtitle languages<small>Comma separated, e.g. <code>en.*,ta,hi</code></small></span><input type="text" data-key="sub_langs"></label>

    <h4>Audio</h4>
    <label class="field"><span>Format</span>
      <select data-key="audio_format"><option value="mp3">MP3</option><option value="m4a">M4A (AAC)</option><option value="opus">Opus</option><option value="flac">FLAC</option><option value="wav">WAV</option></select></label>
    <label class="field"><span>Quality<small>Only applies to MP3 / M4A / Opus</small></span>
      <select data-key="audio_quality"><option value="0">Best (VBR)</option><option value="320">320 kbps</option><option value="256">256 kbps</option><option value="192">192 kbps</option><option value="128">128 kbps</option></select></label>

    <h4>Extras</h4>
    <label class="field"><span>Embed cover / thumbnail</span><input type="checkbox" data-key="embed_thumbnail"></label>
    <label class="field"><span>Embed title, artist &amp; description</span><input type="checkbox" data-key="embed_metadata"></label>
    <label class="field"><span>Embed chapters</span><input type="checkbox" data-key="embed_chapters"></label>
    <label class="field"><span>Cut out sponsor segments<small>Uses SponsorBlock - removes sponsor, self-promo and "subscribe" reminders</small></span><input type="checkbox" data-key="sponsorblock"></label>

    <h4>Organising</h4>
    <label class="field"><span>Put playlists in their own folder</span><input type="checkbox" data-key="playlist_folder"></label>
    <label class="field"><span>Number playlist files (01 - …)</span><input type="checkbox" data-key="number_playlist_items"></label>
    <label class="field"><span>Skip things I already downloaded<small>Remembers finished downloads, separately for video and audio</small></span><input type="checkbox" data-key="skip_downloaded"></label>

    <h4>Network</h4>
    <label class="field"><span>Downloads at the same time</span><input type="number" min="1" max="5" data-key="max_parallel"></label>
    <label class="field"><span>Parallel fragments per download</span><input type="number" min="1" max="16" data-key="concurrent_fragments"></label>
    <label class="field"><span>Speed limit<small>e.g. <code>2M</code> or <code>500K</code>; empty = unlimited</small></span><input type="text" data-key="rate_limit" placeholder="Unlimited"></label>
    <label class="field"><span>Use cookies from browser<small>For age-restricted / members-only videos or "confirm you're not a bot". Firefox is most reliable.</small></span>
      <select data-key="cookies_browser"><option value="">Off</option><option value="firefox">Firefox</option><option value="chrome">Chrome</option><option value="edge">Edge</option><option value="brave">Brave</option><option value="opera">Opera</option><option value="vivaldi">Vivaldi</option></select></label>

    <h4>Maintenance</h4>
    <div class="field"><span>Update yt-dlp<small id="verLine"></small></span><button class="btn sm" id="updateBtn">Update</button></div>
    <div class="field"><span>Quit TubeGrab<small>Stops the background program</small></span><button class="btn sm" id="quitBtn">Quit</button></div>
  </div>
</dialog>

<div class="toast" id="toast"></div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S = {settings:{}, env:{}, jobs:[]};
let cards = [];      // analysed links waiting for the user
let cardSeq = 0;
const jobEls = new Map();

async function api(path, body){
  const r = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers: {"X-Token": TOKEN, "Content-Type": "application/json"},
    body: body === undefined ? undefined : JSON.stringify(body)});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.hint = j.hint; throw e; }
  return j;
}
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),3200); }
function fmtDur(s){ if(!s && s!==0) return ""; s=Math.round(s); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0"); }
function fmtSpeed(b){ if(!b) return ""; const u=["B/s","KB/s","MB/s","GB/s"]; let i=0; while(b>=1024&&i<3){b/=1024;i++} return b.toFixed(i?1:0)+" "+u[i]; }
function compress(set){ // {1,2,3,5} -> "1-3,5"
  const a=[...set].sort((x,y)=>x-y), out=[]; let i=0;
  while(i<a.length){ let j=i; while(j+1<a.length && a[j+1]===a[j]+1) j++; out.push(i===j? ""+a[i] : a[i]+"-"+a[j]); i=j+1; }
  return out.join(",");
}

/* ---------- settings ---------- */
async function saveSetting(key, value){
  try { const r = await api("/api/settings", {[key]: value}); S.settings = r.settings; renderTop(); }
  catch(e){ toast(e.message); }
}
function fillSettings(){
  document.querySelectorAll("[data-key]").forEach(el => {
    const v = S.settings[el.dataset.key];
    if (el.type === "checkbox") el.checked = !!v; else if (document.activeElement !== el) el.value = v ?? "";
  });
  $("#verLine").textContent = `TubeGrab ${S.env.app_version} · yt-dlp ${S.env.ytdlp_version}` + (S.env.repo ? ` · github.com/${S.env.repo}` : "");
}
document.querySelectorAll("[data-key]").forEach(el => el.addEventListener("change", () =>
  saveSetting(el.dataset.key, el.type === "checkbox" ? el.checked : el.type === "number" ? +el.value : el.value)));

/* ---------- top bar, mode & quick quality ---------- */
function renderTop(){
  const e = S.env, s = S.settings;
  $("#pills").innerHTML =
    `<span class="pill">yt-dlp ${esc(e.ytdlp_version)}</span>` +
    `<span class="pill ${e.ffmpeg?"ok":"bad"}">${e.ffmpeg?"FFmpeg ✓":"FFmpeg missing"}</span>` +
    `<span class="pill ${e.js_runtime?"ok":"bad"}">${e.js_runtime? esc(e.js_runtime[0].toUpperCase()+e.js_runtime.slice(1))+" ✓" : "Deno missing"}</span>`;
  let b = "";
  if (e.update) b += `<div class="banner ok"><div><b>TubeGrab ${esc(e.update.version)} is available</b> (you have ${esc(e.app_version)}).
     <a href="${esc(e.update.url)}" target="_blank" rel="noopener">Download the new version</a></div></div>`;
  if (!e.ffmpeg) b += `<div class="banner err"><div><b>FFmpeg is required</b> to merge video and audio and to make MP3s.
     Install it, then restart TubeGrab: <code>winget install Gyan.FFmpeg</code>
     <br><small>Or put <code>ffmpeg.exe</code> and <code>ffprobe.exe</code> next to TubeGrab.</small></div></div>`;
  if (!e.js_runtime) b += `<div class="banner"><div><b>Deno is recommended</b> - YouTube now needs a JavaScript runtime for yt-dlp to work reliably.
     Install it, then restart TubeGrab: <code>winget install DenoLand.Deno</code></div></div>`;
  $("#banners").innerHTML = b;
  document.querySelectorAll("#modeSeg button").forEach(x => x.classList.toggle("on", x.dataset.mode === s.mode));
  const q = $("#quickQuality");
  const opts = s.mode === "audio"
    ? [["mp3","MP3"],["m4a","M4A"],["opus","Opus"],["flac","FLAC"],["wav","WAV"]]
    : [["best","Best quality"],["2160","4K"],["1440","1440p"],["1080","1080p"],["720","720p"],["480","480p"],["360","360p"]];
  const key = s.mode === "audio" ? "audio_format" : "video_quality";
  q.innerHTML = opts.map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
  q.value = s[key]; q.dataset.for = key;
  fillSettings();
}
$("#modeSeg").addEventListener("click", ev => { const b = ev.target.closest("button"); if (b) { saveSetting("mode", b.dataset.mode); cards.forEach(c => { if(!c.modeTouched) c.mode = b.dataset.mode; }); renderCards(); } });
$("#quickQuality").addEventListener("change", ev => saveSetting(ev.target.dataset.for, ev.target.value));

/* ---------- adding links ---------- */
function extractUrls(text){
  // full links, plus bare ones like "youtu.be/xyz" or "www.youtube.com/watch?v=..."
  const re = /(?:https?:\/\/|www\.|(?:m\.|music\.)?youtube\.com\/|youtu\.be\/)[^\s"'<>,\]\[]+/gi;
  const found = String(text || "").match(re) || [];
  return [...new Set(found.map(u => {
    u = u.replace(/[).;]+$/, "");
    return /^https?:\/\//i.test(u) ? u : "https://" + u;
  }))];
}
// auto = true: download as soon as the link is read (Download button / Ctrl+Enter)
function addLinks(text, auto = false){
  const urls = extractUrls(text);
  if (!urls.length) { toast("No links found - paste a YouTube link first"); $("#links").focus(); return; }
  let added = 0;
  for (const url of urls) {
    const existing = cards.find(c => c.url === url);
    if (existing) { if (auto && existing.state === "ready") enqueue(existing); continue; }
    const card = {id: ++cardSeq, url, state: "loading", mode: S.settings.mode, modeTouched: false, auto};
    cards.push(card); added++;
    analyse(card);
  }
  $("#links").value = "";
  renderCards();
  if (auto) toast(`Starting ${urls.length} download${urls.length > 1 ? "s" : ""}…`);
  else if (added < urls.length) toast(`${urls.length - added} duplicate link(s) skipped`);
}
async function analyse(card){
  card.state = "loading"; card.error = null; renderCards();
  try {
    const info = await api("/api/analyze", {url: card.url});
    Object.assign(card, {info, state: "ready"});
    if (info.kind === "playlist") {
      card.scope = "playlist";
      card.from = 1; card.to = info.count;
      card.selected = new Set(info.entries.map(e => e.index));
    }
  } catch(e) { card.state = "error"; card.error = e.message; card.hint = e.hint; }
  if (card.auto && card.state === "ready") {
    if (card.info.kind !== "playlist") return enqueue(card);
    if (card.info.has_single) { card.scope = "video"; return enqueue(card); }  // video opened from a playlist
    card.waiting = true;   // real playlist: let the user choose the range first
    toast("Playlist found - choose the items, then press its Download button");
  }
  renderCards();
}
$("#downloadBtn").onclick = () => addLinks($("#links").value, true);
$("#addBtn").onclick = () => addLinks($("#links").value, false);
$("#links").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); addLinks($("#links").value, true); }
});
// Paste puts the clipboard into the box so you can see it, then you press Download.
$("#pasteBtn").onclick = async () => {
  const box = $("#links");
  let text = "";
  try { text = await navigator.clipboard.readText(); }
  catch {
    box.focus(); box.select();
    toast("Your browser blocked the Paste button - press Ctrl+V in the box instead");
    return;
  }
  if (!extractUrls(text).length) { toast("The clipboard doesn't contain a link"); box.focus(); return; }
  box.value = (box.value.trim() ? box.value.trim() + "\n" : "") + text.trim() + "\n";
  box.focus(); box.selectionStart = box.selectionEnd = box.value.length;
};
$("#importFile").onchange = async e => { const f = e.target.files[0]; if (f) addLinks(await f.text()); e.target.value = ""; };
const addPanel = $("#addPanel");
addPanel.addEventListener("dragover", e => { e.preventDefault(); addPanel.classList.add("drag"); });
addPanel.addEventListener("dragleave", () => addPanel.classList.remove("drag"));
addPanel.addEventListener("drop", async e => {
  e.preventDefault(); addPanel.classList.remove("drag");
  const f = e.dataTransfer.files[0];
  addLinks(f ? await f.text() : (e.dataTransfer.getData("text/uri-list") || e.dataTransfer.getData("text")));
});

/* ---------- ready cards ---------- */
function cardHTML(c){
  const remove = `<button class="btn ghost sm" data-act="remove" title="Remove">✕</button>`;
  if (c.state === "loading") return `<div class="panel card"><div class="thumb"></div><div class="body">
      <div class="title"><span class="spin"></span>&nbsp; Reading link…</div><div class="meta">${esc(c.url)}</div></div>
      <div class="actions">${remove}</div></div>`;
  if (c.state === "error") return `<div class="panel card"><div class="thumb"></div><div class="body">
      <div class="title">Couldn't read this link</div><div class="meta">${esc(c.url)}</div>
      <div class="errs">${c.hint?`<div class="hint">${esc(c.hint)}</div>`:""}${esc(c.error)}</div></div>
      <div class="actions"><button class="btn sm" data-act="retry">Try again</button>${remove}</div></div>`;
  const i = c.info, isPl = i.kind === "playlist";
  const modeSel = `<select data-act="mode"><option value="video"${c.mode==="video"?" selected":""}>🎬 Video</option><option value="audio"${c.mode==="audio"?" selected":""}>🎵 Audio</option></select>`;
  let extra = "";
  if (isPl) {
    const scope = i.has_single ? `<div class="seg" data-act="scope">
        <button data-scope="video" class="${c.scope==="video"?"on":""}">Just this video</button>
        <button data-scope="playlist" class="${c.scope==="playlist"?"on":""}">Whole playlist</button></div>` : "";
    const rangeUi = c.scope === "playlist" ? `
        <span>Items</span><input type="number" min="1" max="${i.count}" value="${c.from}" data-act="from">
        <span>to</span><input type="number" min="1" max="${i.count}" value="${c.to}" data-act="to">
        <span class="count">${c.selected.size} of ${i.count} selected</span>
        <button class="btn ghost sm" data-act="toggleList">${c.open?"Hide list":"Pick items"}</button>` : "";
    extra = `<div class="controls">${scope}${rangeUi}</div>`;
    if (c.open && c.scope === "playlist") {
      extra += `<div class="controls"><button class="btn sm" data-act="all">Select all</button><button class="btn sm" data-act="none">Select none</button></div>
        <div class="items">${i.entries.map(e => `<label><input type="checkbox" data-idx="${e.index}"${c.selected.has(e.index)?" checked":""}>
          <span class="n">${e.index}</span><span class="t">${esc(e.title)}</span><span class="d">${fmtDur(e.duration)}</span></label>`).join("")}</div>`;
    }
  }
  const badge = isPl ? `${i.count} items` : fmtDur(i.duration);
  if (c.waiting) extra = `<div class="note">👉 Choose which items you want, then press <b>Download</b>.</div>` + extra;
  return `<div class="panel card${c.waiting ? " waiting" : ""}">
    <div class="thumb" style="${i.thumbnail?`background-image:url('${esc(i.thumbnail)}')`:""}">${badge?`<span class="badge">${badge}</span>`:""}</div>
    <div class="body"><div class="title">${esc(i.title)}</div>
      <div class="meta">${isPl?'<span class="tag">Playlist</span>':""}${esc(i.uploader)}</div>${extra}</div>
    <div class="actions">${modeSel}<button class="btn primary sm" data-act="download">Download</button>${remove}</div></div>`;
}
let renderQueued = false;
function renderCards(){   // batched: avoids re-rendering in the middle of an input's blur/change
  if (renderQueued) return; renderQueued = true;
  requestAnimationFrame(() => { renderQueued = false; renderCardsNow(); });
}
function renderCardsNow(){
  $("#readySection").classList.toggle("hidden", !cards.length);
  $("#readyCount").textContent = cards.length ? `${cards.length} link${cards.length>1?"s":""}` : "";
  const box = $("#ready");
  const scroll = new Map([...box.querySelectorAll(".items")].map(el => [el.closest("[data-card]").dataset.card, el.scrollTop]));
  box.innerHTML = cards.map(c => `<div data-card="${c.id}">${cardHTML(c)}</div>`).join("");
  box.querySelectorAll(".items").forEach(el => { const s = scroll.get(el.closest("[data-card]").dataset.card); if (s) el.scrollTop = s; });
}
const findCard = el => cards.find(c => c.id === +el.closest("[data-card]")?.dataset.card);
$("#ready").addEventListener("click", ev => {
  const t = ev.target, c = findCard(t); if (!c) return;
  const act = t.closest("[data-act]")?.dataset.act;
  if (act === "remove") { cards = cards.filter(x => x !== c); renderCards(); }
  else if (act === "retry") analyse(c);
  else if (act === "download") enqueue(c);
  else if (act === "toggleList") { c.open = !c.open; renderCards(); }
  else if (act === "all") { c.selected = new Set(c.info.entries.map(e => e.index)); c.from = 1; c.to = c.info.count; renderCards(); }
  else if (act === "none") { c.selected = new Set(); renderCards(); }
  else if (act === "scope" && t.dataset.scope) { c.scope = t.dataset.scope; renderCards(); }
});
$("#ready").addEventListener("change", ev => {
  const t = ev.target, c = findCard(t); if (!c) return;
  if (t.dataset.act === "mode") { c.mode = t.value; c.modeTouched = true; }
  else if (t.dataset.act === "from" || t.dataset.act === "to") {
    const n = c.info.count;
    let a = Math.max(1, Math.min(n, parseInt(t.closest(".controls").querySelector('[data-act="from"]').value) || 1));
    let b = Math.max(1, Math.min(n, parseInt(t.closest(".controls").querySelector('[data-act="to"]').value) || n));
    if (a > b) [a, b] = [b, a];
    c.from = a; c.to = b;
    c.selected = new Set(Array.from({length: b - a + 1}, (_, k) => a + k));
    renderCards();
  } else if (t.dataset.idx) {
    const idx = +t.dataset.idx; t.checked ? c.selected.add(idx) : c.selected.delete(idx);
    const sel = [...c.selected]; c.from = sel.length ? Math.min(...sel) : 1; c.to = sel.length ? Math.max(...sel) : 1;
    renderCards();
  }
});
async function enqueue(c){
  if (c.state !== "ready") return false;
  const i = c.info, body = {url: c.url, title: i.title, thumbnail: i.thumbnail, kind: i.kind, mode: c.mode};
  if (i.kind === "playlist") {
    if (c.scope === "video") { body.noplaylist = true; body.kind = "video"; }
    else {
      if (!c.selected.size) { toast("Pick at least one item"); return false; }
      body.items = c.selected.size === i.count ? "" : compress(c.selected);
      body.expected = c.selected.size;
    }
  }
  try { await api("/api/jobs", body); cards = cards.filter(x => x !== c); renderCards(); refresh(); return true; }
  catch(e) { toast(e.message); return false; }
}
$("#downloadAll").onclick = async () => {
  const ready = cards.filter(c => c.state === "ready");
  if (!ready.length) { toast("Nothing ready yet"); return; }
  for (const c of ready) await enqueue(c);
};
$("#clearReady").onclick = () => { cards = []; renderCards(); };

/* ---------- downloads ---------- */
const STATUS = {queued:"Waiting", starting:"Starting", downloading:"Downloading", processing:"Processing",
                done:"Done", partial:"Finished with errors", error:"Failed", cancelled:"Cancelled"};
function jobInner(j){
  const active = ["queued","starting","downloading","processing"].includes(j.status);
  const multi = j.total > 1;
  const bits = [`<span class="st">${STATUS[j.status] || j.status}</span>`];
  if (j.status === "processing" && j.stage) bits.push(esc(j.stage));
  if (multi && j.status !== "done") bits.push(`${Math.min(j.item, j.total)} / ${j.total}`);
  if (j.status === "done" && j.file_count) bits.push(`${j.file_count} file${j.file_count>1?"s":""}`);
  if (j.skipped) bits.push(`${j.skipped} already downloaded`);
  if (j.status === "downloading") { bits.push(`${Math.floor(j.percent)}%`); if (j.speed) bits.push(fmtSpeed(j.speed)); if (j.eta != null) bits.push(`${fmtDur(j.eta)} left`); }
  const btns = [];
  if (active) btns.push(`<button class="btn sm" data-job="cancel">Cancel</button>`);
  if (["error","partial","cancelled"].includes(j.status)) btns.push(`<button class="btn sm" data-job="retry">Retry</button>`);
  if (["done","partial"].includes(j.status)) btns.push(`<button class="btn primary sm" data-job="open">Show</button>`);
  if (!active) btns.push(`<button class="btn ghost sm" data-job="remove" title="Remove from list">✕</button>`);
  const errs = j.errors.length && !active ? `<div class="errs">${j.hint?`<div class="hint">💡 ${esc(j.hint)}</div>`:""}${j.errors.slice(-4).map(esc).join("<br>")}</div>` : "";
  const sub = multi && j.current && active ? `<div class="meta">▸ ${esc(j.current)}</div>` : "";
  return `<div class="thumb" style="${j.thumbnail?`background-image:url('${esc(j.thumbnail)}')`:""}"></div>
    <div class="body"><div class="title">${esc(j.title)}</div>
      <div class="meta"><span class="tag ${j.mode}">${j.mode === "audio" ? "AUDIO" : "VIDEO"}</span>${j.items?`items ${esc(j.items)}`:""}</div>
      ${sub}<div class="bar"><i style="width:${j.percent}%"></i></div><div class="status">${bits.join("<span>·</span>")}</div>${errs}</div>
    <div class="actions">${btns.join("")}</div>`;
}
function renderJobs(){
  const box = $("#jobs"), seen = new Set();
  S.jobs.forEach(j => {
    seen.add(j.id);
    let el = jobEls.get(j.id);
    if (!el) { el = document.createElement("div"); el.dataset.id = j.id; box.prepend(el); jobEls.set(j.id, el); }
    const html = jobInner(j);
    if (el._html !== html) { el.innerHTML = html; el._html = html; }
    el.className = `panel card job ${j.status}`;
  });
  for (const [id, el] of jobEls) if (!seen.has(id)) { el.remove(); jobEls.delete(id); }
  $("#jobsEmpty").classList.toggle("hidden", S.jobs.length > 0);
  const act = S.jobs.filter(j => ["starting","downloading","processing"].includes(j.status)).length;
  $("#jobCount").textContent = S.jobs.length ? `${act} active · ${S.jobs.length} total` : "";
  document.title = act ? `(${act}) TubeGrab` : "TubeGrab";
}
$("#jobs").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-job]"); if (!b) return;
  const id = b.closest("[data-id]").dataset.id;
  try { await api(`/api/jobs/${id}/${b.dataset.job}`, {}); refresh(); } catch(e) { toast(e.message); }
});
$("#clearDone").onclick = () => api("/api/jobs/clear", {}).then(refresh);

/* ---------- misc buttons ---------- */
$("#openFolder").onclick = () => api("/api/open-folder", {}).catch(e => toast(e.message));
$("#openSettings").onclick = () => { fillSettings(); $("#settings").showModal(); };
$("#closeSettings").onclick = () => $("#settings").close();
$("#browse").onclick = async () => { try { const r = await api("/api/browse", {}); S.settings = r.settings; fillSettings(); } catch(e) { toast(e.message); } };
$("#updateBtn").onclick = async ev => {
  const b = ev.target; b.disabled = true; b.innerHTML = '<span class="spin"></span>';
  try { const r = await api("/api/update", {}); toast(r.message); } catch(e) { toast(e.message); }
  b.disabled = false; b.textContent = "Update";
};
$("#quitBtn").onclick = async () => {
  if (S.jobs.some(j => ["starting","downloading","processing"].includes(j.status)) && !confirm("Downloads are still running. Quit anyway?")) return;
  await api("/api/quit", {}).catch(() => {});
  document.body.innerHTML = '<div class="wrap"><div class="empty">TubeGrab has stopped. You can close this tab.</div></div>';
  clearInterval(poll);
};

/* ---------- polling ---------- */
let lastSettings = "";
async function refresh(){
  try {
    const st = await api("/api/state");
    S.jobs = st.jobs; S.env = st.env;
    const ss = JSON.stringify(st.settings);
    if (ss !== lastSettings) { S.settings = st.settings; lastSettings = ss; renderTop(); }
    renderJobs();
  } catch { /* server stopped */ }
}
const poll = setInterval(refresh, 800);
refresh();
window.addEventListener("beforeunload", e => {
  if (S.jobs.some(j => ["queued","starting","downloading","processing"].includes(j.status))) { e.preventDefault(); }
});
</script>
</body>
