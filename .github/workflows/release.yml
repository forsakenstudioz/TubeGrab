name: Build & release

# Push a tag like v1.1.0 -> builds TubeGrab.exe + a portable zip and publishes a GitHub Release.
# "Run workflow" from the Actions tab -> builds only (download it from the run's Artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build tools (always the newest yt-dlp)
        run: python -m pip install -U pyinstaller "yt-dlp[default]"

      - name: Stamp version and repo into the app
        shell: python
        run: |
          import os, re, pathlib
          p = pathlib.Path("tubegrab.py")
          src = p.read_text("utf-8")
          ref = os.environ["GITHUB_REF_NAME"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              src = re.sub(r'^APP_VERSION = ".*"', f'APP_VERSION = "{ref.lstrip("vV")}"', src, count=1, flags=re.M)
          src = re.sub(r'^GITHUB_REPO = ".*"', f'GITHUB_REPO = "{os.environ["GITHUB_REPOSITORY"]}"', src, count=1, flags=re.M)
          p.write_text(src, "utf-8")
          print(re.findall(r'^(APP_VERSION|GITHUB_REPO) = .*', src, flags=re.M))

      - name: Build TubeGrab.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --name TubeGrab --add-data "ui.html;." tubegrab.py

      - name: Make the portable zip (exe + FFmpeg + Deno, nothing to install)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory tools, portable | Out-Null
          Invoke-WebRequest "https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile tools/ffmpeg.zip
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile tools/deno.zip
          Expand-Archive tools/ffmpeg.zip tools/ffmpeg
          Expand-Archive tools/deno.zip tools/deno
          $ff = Get-ChildItem tools/ffmpeg -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $ff.FullName, (Join-Path $ff.DirectoryName "ffprobe.exe"), tools/deno/deno.exe, dist/TubeGrab.exe, README.md, LICENSE portable/
          $lic = Get-ChildItem tools/ffmpeg -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($lic) { Copy-Item $lic.FullName portable/FFMPEG-LICENSE.txt }
          Compress-Archive portable/* TubeGrab-portable-win64.zip

      - uses: actions/upload-artifact@v7
        with:
          name: TubeGrab-windows
          path: |
            dist/TubeGrab.exe
            TubeGrab-portable-win64.zip

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            **Easiest:** download `TubeGrab-portable-win64.zip`, unzip it anywhere and run `TubeGrab.exe` - FFmpeg and Deno are included.
            Already have FFmpeg + Deno installed? Just grab `TubeGrab.exe`.
          files: |
            dist/TubeGrab.exe
            TubeGrab-portable-win64.zip
