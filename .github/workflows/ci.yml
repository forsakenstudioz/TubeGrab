name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      # A ready-made static FFmpeg instead of apt-get (which was the slow part).
      # It is cached, so after the first run this step takes a couple of seconds.
      - name: Restore FFmpeg from cache
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ~/ffmpeg
          key: ffmpeg-linux64-v1
      - name: Download FFmpeg (first run only)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/ffmpeg
          curl -sSL https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C ~/ffmpeg --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
      - name: Put FFmpeg on PATH
        run: |
          echo "$HOME/ffmpeg" >> "$GITHUB_PATH"
          ~/ffmpeg/ffmpeg -version | head -1

      - name: Install dependencies
        run: python -m pip install -U "yt-dlp[default]" pytest
      - name: Run tests
        run: python -m pytest -q
